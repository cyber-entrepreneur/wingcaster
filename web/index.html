<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('wingcaster.brand')
          var mode = 'system'
          if (stored) {
            var parsed = JSON.parse(stored)
            if (parsed && (parsed.mode === 'light' || parsed.mode === 'dark' || parsed.mode === 'system')) {
              mode = parsed.mode
            }
          }
          if (mode === 'light' || mode === 'dark') {
            document.documentElement.setAttribute('data-lc-mode', mode)
          } else {
            document.documentElement.removeAttribute('data-lc-mode')
          }
        } catch (e) {}
      })()
    </script>
    <link id="brand-favicon" rel="icon" type="image/svg+xml" href="/brand/wingcaster-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF8F7" />
    <title>Wingcaster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Arabic UI font for SHR-NAV-006 — preload before LCP so AR pill never flashes Latin glyphs -->
    <link rel="preload" href="/fonts/ibm-plex-sans-arabic-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-arabic-600.woff2" as="font" type="font/woff2" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
