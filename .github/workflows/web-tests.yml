name: web tests

# The web suite had no CI at all until Phase 7f/2 — 93 tests that never ran
# anywhere except a developer's machine. That is exactly the trap the backend
# suite fell into: tests exist, a document cites their count as proof, and
# nothing actually executes them. This workflow closes it.
#
# Typecheck and production build run alongside the tests because the project's
# quality bar requires both to be green before a commit, and neither was
# enforced automatically either.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-tests.yml'
  # No branches filter — stacked Wave 4A/8 PRs targeting feat/* must still run CI.
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-tests.yml'

concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, tests, production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # `npm ci` in web/ triggers a postinstall that installs the backend too;
      # --ignore-scripts keeps this job to the frontend, which is all it tests.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      # ubuntu-latest ~7GB RAM. One vitest process across 100+ DOM-heavy files
      # accumulates until the worker is OOM-killed ("Worker exited unexpectedly")
      # even with 6–8GB heaps (which exceed runner RAM). Split by directory so
      # each process resets RSS, and pin forks to 4GB so parent+worker+OS fit.
      - name: Tests — pages/agent
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx vitest run src/pages/agent

      - name: Tests — pages (non-agent)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx vitest run src/pages --exclude 'src/pages/agent/**'

      - name: Tests — components
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx vitest run src/components

      - name: Tests — unit (hooks/lib/api/…)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx vitest run src/hooks src/lib src/api src/app src/wf03 src/wf04

      - name: Tests — theme visual + a11y
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npx vitest run src/theme

      - name: Production build
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          # SENTRY_AUTH_TOKEN intentionally unset in CI — plugin no-ops; maps stay local.
        run: npx vite build
