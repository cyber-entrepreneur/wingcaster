name: web tests

# The web suite had no CI at all until Phase 7f/2 — 93 tests that never ran
# anywhere except a developer's machine. That is exactly the trap the backend
# suite fell into: tests exist, a document cites their count as proof, and
# nothing actually executes them. This workflow closes it.
#
# Typecheck and production build run alongside the tests because the project's
# quality bar requires both to be green before a commit, and neither was
# enforced automatically either.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-tests.yml'
  # No branches filter — stacked Wave 4A/8 PRs targeting feat/* must still run CI.
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-tests.yml'

concurrency:
  group: web-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, tests, production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # `npm ci` in web/ triggers a postinstall that installs the backend too;
      # --ignore-scripts keeps this job to the frontend, which is all it tests.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      # Split suites: one vitest process across 130+ files accumulates DOM
      # snapshots until V8 OOMs even at 8GB, and ubuntu-latest only has ~7GB
      # RAM. Fresh processes + 6GB heap keep each phase under the runner ceiling.
      # Theme is split again (visual vs a11y/unit) — a single theme phase still
      # GC-thrashed past 35+ minutes on ubuntu-latest after the app/theme split.
      - name: Tests — app (non-theme)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vitest run --exclude 'src/theme/**'

      - name: Tests — theme visual
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vitest run 'src/theme/**/*.visual.test.tsx'

      - name: Tests — theme a11y + unit
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vitest run src/theme --exclude 'src/theme/**/*.visual.test.tsx'

      - name: Production build
        env:
          VITE_GIT_SHA: ${{ github.sha }}
          # SENTRY_AUTH_TOKEN intentionally unset in CI — plugin no-ops; maps stay local.
        run: npx vite build
